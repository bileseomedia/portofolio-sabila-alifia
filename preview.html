  <style>
    html { scroll-behavior: smooth; }
    .font-editorial { font-family: 'Cormorant Garamond', Georgia, serif; }
    .font-display-accent { font-family: 'Syne', sans-serif; }
    .vertical-writing { writing-mode: vertical-rl; text-orientation: mixed; }
    @keyframes floatSlow { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-12px) rotate(2deg); } }
    @keyframes floatReverse { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(10px) rotate(-2deg); } }
    @keyframes spinSlow { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulseAura { 0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.7; } 50% { transform: scale(1.035) rotate(1.5deg); opacity: 0.95; } }
    @keyframes revealUp { 0% { opacity: 0; transform: translateY(26px); } 100% { opacity: 1; transform: translateY(0); } }
    @keyframes maskReveal { 0% { opacity: 0; clip-path: inset(12% 0 12% 0); transform: scale(1.03); } 100% { opacity: 1; clip-path: inset(0 0 0 0); transform: scale(1); } }
    .animate-float-slow { animation: floatSlow 7s ease-in-out infinite; }
    .animate-float-reverse { animation: floatReverse 8.5s ease-in-out infinite; }
    .animate-spin-slow { animation: spinSlow 24s linear infinite; }
    .animate-pulse-aura { animation: pulseAura 6s ease-in-out infinite; }
    .animate-reveal-up { animation: revealUp 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    .animate-mask-reveal { animation: maskReveal 0.75s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
    </style>
</head>

            </p>
            <div className="p-3 bg-[#FAF0D8] rounded-xl text-xs font-mono text-[#2C2520] break-all">

            <div className="pt-2 text-xs text-[#6E655F]">
